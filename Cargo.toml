[package]
name = "mcp-code-explorer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mcp-code-explorer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ignore = "0.4"
tree-sitter = "0.24"
tree-sitter-typescript = "0.23"

[dev-dependencies]
tempfile = "3"
